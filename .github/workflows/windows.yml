name: Windows CI

# Tag pushes do not trigger this workflow directly: release.yml calls it (and
# the other two platform workflows) and then attaches all assets to the draft
# release in one job. Each platform used to attach its own assets, and two runs
# finishing in the same second each created a separate draft.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # enodemeta, the meta search contract module, is a submodule that go.mod
          # reaches through `replace ... => ./enodemeta`.
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

#      - name: Run tests (unit only)
#        run: go test ./...

      - name: Get version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*ENodeVersionStr[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ed2k/constants.go)
          test -n "$APP_VERSION" || { echo "could not extract ENodeVersionStr from ed2k/constants.go" >&2; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $out = "dist/enode-$env:APP_VERSION-win64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          foreach ($c in "enode","natsim1","natsim2") {
            go build -trimpath -ldflags="-s -w" -o "$out/$c.exe" "./cmd/$c"
          }

      - name: Bundle
        shell: pwsh
        run: |
          $out = "dist/enode-$env:APP_VERSION-win64"
          # update.sh rides along so an install can update itself in place (Git Bash).
          Copy-Item enode.config.yaml,README.md,MIT-LICENSE.txt,scripts/update.sh $out
          # misc/enode.sql is the MySQL DDL applied on first connect; the default
          # storage.mysql.schemaFile is relative to the working directory, so it
          # must sit at misc/ next to the binary.
          New-Item -ItemType Directory -Force "$out/misc" | Out-Null
          Copy-Item misc/enode.sql "$out/misc/"
          # -Path $out (the directory) rather than "$out/*" (its contents):
          # that keeps a top-level enode-<version>-win64/ folder inside the zip,
          # matching the layout of the Linux and macOS tarballs. With the glob
          # the zip explodes into the extractor's current directory.
          Compress-Archive -Path $out -DestinationPath "$out.zip"

      # Git Bash is on the runner, so this reuses the same sha256sum the Linux
      # job runs rather than needing a PowerShell translation. `cd dist` first
      # so the .sha256 records a bare filename -- that is what makes
      # `sha256sum -c` work next to the downloaded archive.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum "enode-${APP_VERSION}-win64.zip" \
            > "enode-${APP_VERSION}-win64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: enode-${{ env.APP_VERSION }}-win64
          path: |
            dist/*.zip
            dist/*.sha256
