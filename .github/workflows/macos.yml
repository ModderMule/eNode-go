name: macOS CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

#      - name: Run tests (unit only)
#        run: go test ./...

      - name: Get version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*ENodeVersionStr[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ed2k/constants.go)
          test -n "$APP_VERSION" || { echo "could not extract ENodeVersionStr from ed2k/constants.go" >&2; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          OUT="dist/enode-${APP_VERSION}-macos-arm64"
          mkdir -p "$OUT"
          for c in enode natsim1 natsim2; do
            go build -trimpath -ldflags="-s -w" -o "$OUT/$c" "./cmd/$c"
          done

      - name: Bundle
        run: |
          OUT="dist/enode-${APP_VERSION}-macos-arm64"
          cp enode.config.yaml README.md MIT-LICENSE.txt "$OUT/"
          tar -C dist -czf "$OUT.tar.gz" "enode-${APP_VERSION}-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: enode-${{ env.APP_VERSION }}-macos-arm64
          path: dist/enode-v*-macos-arm64.tar.gz
