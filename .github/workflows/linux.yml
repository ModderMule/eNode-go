name: Linux CI

# Tag pushes do not trigger this workflow directly: release.yml calls it (and
# the other two platform workflows) and then attaches all assets to the draft
# release in one job. Each platform used to attach its own assets, and two runs
# finishing in the same second each created a separate draft.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # enodemeta, the meta search contract module, is a submodule that go.mod
          # reaches through `replace ... => ./enodemeta`.
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

#      - name: Run tests (full suite, Docker-backed integration)
#        run: ENODE_INTEGRATION=1 go test ./...

      - name: Get version
        shell: bash
        run: |
          APP_VERSION=$(sed -n 's/.*ENodeVersionStr[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' ed2k/constants.go)
          test -n "$APP_VERSION" || { echo "could not extract ENodeVersionStr from ed2k/constants.go" >&2; exit 1; }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          OUT="dist/enode-${APP_VERSION}-linux-amd64"
          mkdir -p "$OUT"
          for c in enode natsim1 natsim2; do
            go build -trimpath -ldflags="-s -w" -o "$OUT/$c" "./cmd/$c"
          done

      - name: Bundle
        run: |
          OUT="dist/enode-${APP_VERSION}-linux-amd64"
          cp enode.config.yaml README.md MIT-LICENSE.txt "$OUT/"
          # update.sh rides along so an install can update itself in place.
          cp scripts/update.sh "$OUT/"
          chmod +x "$OUT/update.sh"
          # misc/enode.sql is the MySQL DDL applied on first connect; the default
          # storage.mysql.schemaFile is relative to the working directory, so it
          # must sit at misc/ next to the binary.
          mkdir -p "$OUT/misc"
          cp misc/enode.sql "$OUT/misc/"
          tar -C dist -czf "$OUT.tar.gz" "enode-${APP_VERSION}-linux-amd64"

      # `cd dist` first so the .sha256 records a bare filename -- that is what
      # makes `sha256sum -c` work next to the downloaded archive.
      - name: Checksum
        shell: bash
        run: |
          cd dist
          sha256sum "enode-${APP_VERSION}-linux-amd64.tar.gz" \
            > "enode-${APP_VERSION}-linux-amd64.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: enode-${{ env.APP_VERSION }}-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
