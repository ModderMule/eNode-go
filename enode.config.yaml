name: "eNode-go"
description: "emule-qt.org"
address: ""
dynIp: "auto"
testUrls:
  - "https://4.ipw.cn"
  - "https://ip.3322.net"
  - "https://api.ipify.org"
  - "https://checkip.amazonaws.com"
  # Returns key=value lines rather than a bare IP; parseIPResponse reads the ip= line.
  - "https://www.cloudflare.com/cdn-cgi/trace"

messageLowID: "You have LowID."

# Keep it ASCII. The art below is laid out for Tahoma, the default eMule (MFC) and
# eMule-Qt server-info font: '$' and '`' share one advance width there (as do the
# digits, '_' and '*'), so rows stay aligned. '.', '[', ']', '#' and ' ' do not.
messageLogin: |-
  Welcome to eNode-go!
  Get eMule-Qt, the modern open-source ed2k client: https://emule-qt.org/
  Available for Windows, MacOS and Linux!
  ``````````````````````````````````````````````````````````````````````````````````````````
  ``````````````$$``````$$``````````````$$$$````````````````````````````$$$$$$``````$$``````
  ``````````````$$$$``$$$$````````````````$$``````````````````````````$$``````$$````$$``````
  ````$$$$$$````$$``$$``$$``$$``````$$````$$``````$$$$$$``````````````$$``````$$``$$$$$$$$``
  ``$$``````$$``$$``$$``$$``$$``````$$````$$````$$``````$$``$$$$$$$$``$$``````$$````$$``````
  ``$$$$$$$$$$``$$``````$$``$$``````$$````$$````$$$$$$$$$$````````````$$``$$``$$````$$``````
  ``$$``````````$$``````$$``$$````$$$$````$$````$$````````````````````$$````$$``````$$``$$``
  ````$$$$$$````$$``````$$````$$$$``$$``$$$$$$````$$$$$$````````````````$$$$``$$``````$$````
  ``````````````````````````````````````````````````````````````````````````````````````````

# Peer servers advertised to clients in OP_SERVERLIST (never this server itself —
# its own identity travels in OP_SERVERIDENT). Empty is valid and the default.
servers: []
  # - ip: "192.0.2.10"
  #   port: 4661

noAssert: false
logLevel: "debug"
logFile: "logs/enode.log"

supportCrypt: true
requestCrypt: true
requireCrypt: true
auxiliarPort: false
IPinLogin: false

tcp:
  port: 5555
  portObfuscated: 5565
  maxConnections: 1000000
  connectionTimeout: 2000
  disconnectTimeout: 3600
  # Seconds from accept to a completed login, not extended by traffic: a socket that
  # trickles bytes or never logs in is dropped after this. disconnectTimeout (idle)
  # applies once logged in.
  loginTimeout: 60
  # Concurrent connections one address (an IPv6 /64) may hold across both TCP ports.
  # Leaves room for a household behind one NAT; 0 turns the cap off.
  maxConnectionsPerIP: 32
  allowLowIDs: true
  minLowID: 1
  maxLowID: 16777215

udp:
  port: 5559
  # tcp.port + 12: the port eMule hardwires for the server-UDP crypt-ping and the
  # only source port it accepts the reply from on first contact. See
  # docs/server-udp-crypt-ping.md.
  portObfuscated: 5567
  # The port obfuscated server-to-server frames are sent from, and the portUDPOBF value
  # published to peers and clients. Defaults to tcp.port + 14, as on Lugdunum, on a
  # socket of its own — open it in the firewall when gossip is enabled. It must not be
  # tcp.port+12: Lugdunum decrypts a reply arriving from that port with the crypt-ping
  # challenge instead of our ServerKey, drops our name reply and does not count us as
  # one of its "working" servers. Setting it equal to portObfuscated still shares that
  # socket, for a host that cannot open another port: replies to a peer server are then
  # keyed on its last crypt-ping challenge, which is less robust. See docs/server-gossip.md.
  portGossip: 5569
  getSources: true
  getFiles: true
  # Each client's UDP obfuscation key is derived from a server secret + the client's
  # IP (not sent verbatim). 0: a 128-bit secret is generated on first start and kept
  # in data/udp.secret — back that file up with the server, since clients keep the
  # derived key. A non-zero value is a legacy 32-bit secret used instead (logged as a
  # warning): it keeps the keys clients got from it, but one observed key is enough to
  # brute-force it. See docs/server-udp-crypt-ping.md.
  serverKey: 0
  # UDP searches and source requests one address (an IPv6 /64) may make per minute;
  # the rest are dropped unanswered. Each is answered with many datagrams to an
  # address nobody verified, so without a budget the server is an amplifier. Status
  # pings are not counted. 0 turns it off.
  rateLimitPerIPPerMinute: 120

# How many files one client may publish to this server. Per-client publish caps, not
# server capacity figures — the soft limit is the only lever the protocol gives a server
# over how large its index grows. See docs/server-client-communication.md#per-client-publish-limits, and
# docs/memory-footprint.md §4 for what a given cap costs in RAM.
#
# Counted cumulatively across every OP_OFFERFILES of one TCP session, which is the only
# way either cap can bite: eMule sends at most min(softLimit, 200) files per packet and
# republishes the remainder every 60 s until its whole share is registered, so no single
# packet reveals how much a client is publishing.
#
# Both are also advertised at OP_GLOBSERVSTATRES offsets +16/+20 and stored by clients as
# the server.met ST_SOFTFILES / ST_HARDFILES tags, so a client is held to the numbers it
# was given. 0 means unlimited on either key; omitting a key uses the default shown.
# hardLimit below softLimit is rejected at load — the client would be disconnected before
# the soft-limit warning could ever be sent.
files:
  # Past this the excess is ignored and the client gets one WARNING message per session;
  # it stays connected. Lugdunum's default is 1000; 10000 is what eNode-go has always
  # advertised, kept so enabling enforcement does not also change what clients are told.
  softLimit: 10000
  # Past this the client is sent an ERROR message and disconnected. Lugdunum's default
  # is 4000.
  hardLimit: 20000

# Server-to-server gossip: the Lugdunum OP_SERVER_LIST_REQ/RES handshake. When on,
# this server registers itself with each seed, harvests their peer lists, and answers
# other servers' requests — so OP_SERVERLIST is populated from the live network
# instead of only from the static `servers:` list above. See docs/server-gossip.md.
gossip:
  enabled: true
  # Servers to bootstrap from: a handful of large public servers that answered the
  # obfuscated bootstrap ping on 2026-10-05; the rest of the mesh is learned from their
  # lists. Empty falls back to the top-level `servers:` list.
  seeds:
    - { ip: "176.123.5.89",    port: 4725 }   # eMule Sunrise
    - { ip: "91.208.162.55",   port: 4235 }   # Sharing-Devils No.3
    - { ip: "85.121.5.137",    port: 4232 }   # Sharing-Devils No.2
    - { ip: "213.141.198.207", port: 4232 }   # Mazinga Server
    - { ip: "57.131.35.107",   port: 4232 }   # MO-ad-free
    - { ip: "85.17.116.222",   port: 6082 }   # ed2k-rust
    - { ip: "143.246.192.192", port: 4232 }   # eMule Nordic
    - { ip: "195.62.47.224",   port: 5555 }   # littlemule eNode
  # How often each peer is re-contacted. Lugdunum's own keepalive is ~165 s, so 150
  # keeps our entry from lapsing on a peer between rounds.
  intervalSeconds: 150
  maxServers: 4096      # eserver's maxservers default; a DoS guard, not a tuning knob
  maxFailures: 5        # consecutive failed rounds before a peer is parked
  publishIPv6: true     # use the OP_SERVER_LIST_*_IPV6 (0xa7/0xa8) extension
  # Permit LAN/loopback peers — eMule's FilterLANIPs preference, inverted. Off by
  # default. Turn it on to gossip with a server on this host or LAN (including the
  # Lugdunum reference container), which is otherwise rejected outright.
  allowPrivatePeers: false
  # Persist verified peers so a restart does not have to re-earn the mesh. Mirrors
  # eserver's autoservlist. Written by the server, hence under data/.
  persist: true
  serverMetFile: "data/server.met"
  persistIntervalSeconds: 225

# Access filters: who may talk to this server at all. A blocked address is dropped
# before any wire parsing, on both TCP and UDP. Both halves are off by default —
# each needs operator-supplied data no default can invent. See docs/access-filters.md.
filter:
  # Static range list in the eMule/guarding.p2p ipfilter.dat format (eserver's
  # ipfilter.srv netmask form is also accepted). Operator-supplied, so not under data/.
  ipfilter:
    enabled: false
    file: "ipfilter.dat"
    # A range is blocked when its level is *below* this value — the convention is
    # inverted, so raising this blocks more. 100 is eMule's default.
    minLevel: 100
    reloadMinutes: 30   # re-read the file on a timer; 0 disables reloading
  # Country blocking from a MaxMind GeoLite2 database. A deny-list: an address that
  # resolves to no country is never blocked.
  geoip:
    enabled: false
    # Downloaded and refreshed by the server, hence under data/.
    database: "data/GeoLite2-Country.mmdb"
    blockedCountries: []          # ISO 3166-1 alpha-2 codes, e.g. ["CN", "RU"]
    # MaxMind download credentials. Leave both empty to use only an existing local
    # database and never contact MaxMind. Put real values in enode.local.yaml, which
    # is gitignored — do not commit them here.
    accountID: ""
    licenseKey: ""
    # GeoLite2-Country is republished weekly. The check is conditional on the current
    # file's MD5, so an unchanged database transfers nothing.
    updateDays: 7

# Torrent and Usenet releases merged into eD2K search results, from the
# torrent-crawler / usenet-crawler daemons over their MetaIngest service. Each row
# carries a pseudo-hash and FT_META_* tags; a stock eMule shows it (the name prefix
# marks it) but cannot download it. The kad network below adds real eD2K files found
# on Kad. Every network is off by default, and off means searches are answered
# exactly as before. See docs/meta-search.md.
metaSearch:
  # Send torrent and Usenet rows to every client. false limits them to clients that
  # announced SRVCAP_METASEARCH (0x10000) at login, or a UDP OP_GLOBSEARCHREQ3 with
  # flag 0x02. Kad rows are not affected.
  advertiseToLegacyClients: true
  # Live Search calls allowed in flight for UDP global searches. Past it a UDP
  # search is answered from the cache and feed only, never by waiting on a daemon.
  udpMaxConcurrent: 16
  torrent:
    enabled: false
    url: "http://127.0.0.1:9701"   # torrent-crawler's MetaIngest listener
    # The daemon's ingest.auth_token. Required unless the daemon is on loopback. Put
    # the real value in enode.local.yaml, which is gitignored.
    token: ""
    namePrefix: "[torrent emule-qt.org] "       # prepended to every filename; "" for none
    liveSearch: true               # forward each search's keywords to the daemon
    searchTimeoutMs: 1500          # TCP: the reply waits at most this long for the daemon
    udpSearchTimeoutMs: 800        # UDP: shorter, it holds a shared worker
    maxResults: 50                 # rows merged into one TCP search answer
    maxUDPResults: 10              # rows per UDP answer (one datagram each); max 50
    # Add this network's catalogue files to the file total sent in OP_SERVERSTATUS
    # and OP_GLOBSERVSTATRES: the daemon's file count with liveSearch on, the feed's
    # rows held with it off. Off by default: eD2K clients then see eD2K files only.
    countInServerStatus: false
    # Subscribe to the daemon's published feed and match it in memory, so those
    # releases need no round trip. Restarts from a snapshot on every start.
    feed:
      enabled: false
      maxRows: 250000              # ~1 KB per row
      reconnectMinSeconds: 5
      reconnectMaxSeconds: 300
  usenet:
    enabled: false
    url: "http://127.0.0.1:9702"   # usenet-crawler's MetaIngest listener
    token: ""
    namePrefix: "[usenet emule-qt.org] "
    liveSearch: true
    searchTimeoutMs: 1500
    udpSearchTimeoutMs: 800
    maxResults: 50
    maxUDPResults: 10
    countInServerStatus: false
    feed:
      enabled: false
      maxRows: 250000
      reconnectMinSeconds: 5
      reconnectMaxSeconds: 300
  # Files found on the eMule Kad network, from the kademlia-crawler daemon. Unlike the
  # two networks above these are real eD2K files: the row carries the file's own hash,
  # so every client can download it and finds its sources on Kad. They go to every
  # client, whatever advertiseToLegacyClients says. eMuleQt knows them by the
  # FT_META_NETWORK tag (0x6D) and shows a Kad icon in place of the prefix. A file a
  # user shares on this server is always answered from the server's own database:
  # the Kad row for the same hash is dropped. Off by default.
  kad:
    enabled: false
    url: "http://127.0.0.1:9703"   # kademlia-crawler's MetaIngest listener
    token: ""
    # Prepended to every filename, e.g. "[kad emule-qt.org] "; "" for none. eMuleQt
    # strips a leading "[kad ...] " bracket; other clients show and keep it.
    namePrefix: "[kad emule-qt.org] "
    liveSearch: true
    searchTimeoutMs: 1500
    udpSearchTimeoutMs: 800
    maxResults: 50
    maxUDPResults: 10
    countInServerStatus: false
    feed:
      enabled: false
      maxRows: 250000
      reconnectMinSeconds: 5
      reconnectMaxSeconds: 300
  # Cache live Search answers per network, keyed by the forwarded keywords, excludes,
  # file type and size bounds. Off by default: a repeat query then asks the daemon again.
  cache:
    enabled: true
    maxEntries: 1000               # distinct queries kept, least recently used evicted
    maxRowsPerEntry: 100
    ttlSeconds: 600

# Client-facing Meta API (enode.meta.v1 MetaApi + AccountApi): how eMuleQt downloads
# the .torrent / .nzb behind a torrent or Usenet search row, and optionally logs in
# first. Off by default. Advertised to clients in OP_SERVERIDENT (ST_META_API 0x9E).
# See docs/meta-api.md.
metaApi:
  enabled: false
  # Base URL sent to clients as ST_META_API. "" derives it from the advertised server
  # IP and the gRPC port (or the HTTP port when gRPC is off).
  advertiseURL: ""
  # Base URL of the HTTP endpoint as reported by GetCaps. "" derives it likewise.
  httpAdvertiseURL: ""
  # Accounts without tls send passwords in clear text. Only set this when a TLS
  # reverse proxy terminates in front of both listeners.
  allowInsecureAuth: false
  # Take client addresses (rate limits, logs) from X-Forwarded-For. Only behind a
  # reverse proxy that sets it; otherwise a client can dodge every per-IP limit.
  trustForwardedFor: false
  tls:
    certFile: ""                   # PEM; with keyFile, both listeners serve TLS
    keyFile: ""
    # Send the certificate's SPKI pin as ST_META_API_FP (0x9C), so a client can trust
    # a self-signed certificate on a bare-IP server.
    advertiseFingerprint: false
  grpc:
    enabled: true                  # gRPC + gRPC-Web; on whenever the API is
    listen: "0.0.0.0:4671"
  http:
    # Plain HTTP endpoint: Connect protocol (proto or JSON POST), GET /caps and the raw
    # GET /meta/v1/{hash}?id={catalog_id}. Off by default. When accounts are enabled
    # this listener also serves the account website (/account), even with this off.
    enabled: false
    listen: "0.0.0.0:4672"
    # Public GET /status on this listener: name, version, uptime and the user, file
    # and server counts clients are already sent. GET /healthz is served either way.
    status: true
  metafileCache:
    maxBytes: 268435456            # 256 MiB of verified metafiles, least recently used evicted
    ttlSeconds: 3600
    negativeTtlSeconds: 60         # how long "not found" / "failed verification" is remembered
  fetchTimeoutMs: 3000             # one FetchMetaFile call to a catalogue daemon
  maxMetafileBytes: 16777216       # larger metafiles are refused
  rateLimit:
    perIPPerMinute: 30             # metafile downloads per client address; 0 = unlimited
    perAccountPerMinute: 120       # per logged-in account; 0 = unlimited
  # MetaApi.Search: paged search of the torrent, Usenet and Kad catalogues (the
  # metaSearch networks with liveSearch on). A request picks one network, or all of
  # them (default).
  search:
    enabled: true                  # served whenever the API is
    # With accounts enabled: true = searching needs an active account, like downloads;
    # false = anyone may search, downloads still need an account.
    requireAccount: true
    timeoutMs: 5000                # daemon calls behind one page
    maxLimit: 100                  # releases per page
    window: 1000                   # deepest release reachable by paging
    # Also search the eD2K files servers know, as a network of its own
    # (META_NETWORK_SERVERS): the files this server's users share, and the files
    # of the servers in serverSearch when it asks them (search or mirror on).
    # Needs no metaSearch network. See docs/meta-api.md.
    servers: false
    cache:
      maxEntries: 2000             # chunks of 100 releases per network and search
      ttlSeconds: 600              # pages stay stable this long
    rateLimit:
      perIPPerMinute: 30           # searches per client address; 0 = unlimited
      perAccountPerMinute: 120     # per logged-in account; 0 = unlimited
  # Optional username/password login. Off = the API is public. On = a user registers
  # on this server's website first (publicURL + /account/register) and the eMule
  # client logs in with that username and password.
  accounts:
    enabled: false
    publicURL: ""                  # the website as users reach it, e.g. https://enode.example.org
    allowRegistration: true
    sessionTtlHours: 720
    minPasswordLength: 8
    pollSeconds: 300               # background check of open steps (unconfirmed payments)
    # Registration steps, in order, beyond username and password. Each has an id (in
    # URLs), a type and enabled; the rest is the type's own. No enabled step means a
    # new account is active at once. More step types and payment providers can be
    # added later without changing the others.
    steps:
      # Paid access through a WooCommerce shop: the user picks a plan, is sent to the
      # shop to pay, and the server reads the order status through the shop's REST
      # API. Needs the mysql or mongodb engine (the memory engine loses accounts).
      - id: payment
        type: payment
        enabled: false
        renewable: true            # reopen the step when the paid period ends
        # Keep re-checking a confirmed payment for this many days (hourly, or at once on
        # a webhook) and take its access back if the shop refunds or cancels it. 0 = off.
        refundWindowDays: 0
        plans:
          - id: monthly
            title: "30 days"
            periodDays: 30         # 0 = access never expires
            providerRefs:
              woocommerce: "0"     # the WooCommerce product id of this plan
        providers:
          woocommerce:
            enabled: true
            storeURL: ""           # the shop's home URL, e.g. https://shop.example.org/
            # A REST API key with read/write access (WooCommerce > Settings > Advanced >
            # REST API). Put the real values in enode.local.yaml, which is gitignored.
            consumerKey: ""
            consumerSecret: ""
            # Secret of an order.updated webhook pointed at
            # {publicURL}/account/step/payment/hook/woocommerce. "" disables it; the
            # poller still confirms every payment.
            webhookSecret: ""
            allowInsecureStore: false  # permit a plain-HTTP shop that is not on loopback
            title: "Shop checkout"
            timeoutSeconds: 15
# Server-to-server search: other eD2K servers search and browse this server's own
# file catalogue, and this server theirs. Off by default. An answer carries files
# and source counts and never a source: no client is identified to another server.
# Changing anything here needs a restart. See docs/server-search.md.
serverSearch:
  enabled: false
  # Who may call. "allowlist": only the peers below, each by its token. "gossip":
  # also any server the gossip peer table has verified, without a token; the
  # service is then advertised in the UDP server description reply.
  mode: allowlist
  listen: 0.0.0.0:4673
  # Base URL other servers reach the listener on, advertised in gossip mode. ""
  # derives it from the advertised server IP and the listener's port.
  advertiseURL: ""
  # Tokens without tls cross the network in clear text. Only set this behind a TLS
  # reverse proxy, or for peers on a private network.
  allowInsecureAuth: false
  # Take the caller's address from X-Forwarded-For. Only behind a reverse proxy
  # that sets it: gossip mode admits a caller by its address.
  trustForwardedFor: false
  # Certificate of the listener. A self-signed one is enough: give its fingerprint
  # (logged at startup) to the peers, or let gossip mode advertise it.
  tls:
    certFile: ""
    keyFile: ""
  # What this server answers for other servers.
  serve:
    search: true
    browse: true
    # Most files in one answer.
    maxSearchLimit: 200
    maxBrowseLimit: 1000
    # Pause asked of a server between two browse calls; 0 asks for none.
    browseMinIntervalSeconds: 1
    # Search answers are kept this long so that paging one is stable.
    cache:
      maxEntries: 500
      ttlSeconds: 300
    # Calls per minute; 0 disables a limit. perIP counts every caller by address
    # before it is identified, perPeer an admitted server.
    rateLimit:
      perIPPerMinute: 120
      perPeerPerMinute: 600
  # The servers to exchange searches with. A token is agreed by both operators and
  # serves both directions. url may be left out for a peer that only calls in.
  #   - url: https://server.example.org:4673
  #     token: "a-long-random-string"
  #     fingerprint: "sha256/..."   # pins a self-signed certificate
  peers: []
  # Ask the peers on a client's search and add their files to the answer.
  search:
    enabled: false
    # A peer slower than this is left out of the answer.
    timeoutMs: 1500
    # Most files taken from one peer for one search.
    maxResults: 50
    cache:
      maxEntries: 1000
      ttlSeconds: 300
  # Keep a copy of each peer's catalogue in memory by browsing it, so a search is
  # answered without calling the peer. The copy is rebuilt after a restart.
  mirror:
    enabled: false
    # Minutes between two walks of one peer.
    intervalMinutes: 60
    # Most files kept, across all peers.
    maxFiles: 500000
    # Files asked for per browse call.
    pageSize: 1000
    # Drop a peer's files when no walk of it completed for this many hours.
    staleHours: 24

natTraversal:
  enabled: true
  port: 2004
  ipv6: true                 # IPv6 hole-punching (dual-stack candidates); needs ipv6.enabled
  serverIndependent: true    # cross-server / serverless LowID↔LowID rendezvous (default on)
  registrationTTLSeconds: 30

# IPv6 dual-stack support. When enabled (the default), the TCP/UDP listeners bind
# the dual-stack wildcard (an empty top-level `address`), the server accepts IPv6
# client logins, records each client's IPv6 and its verified reachability, and
# publishes IPv6 sources to clients that opt in. Set enabled: false for the exact
# pre-IPv6 IPv4-only behaviour. An explicit IPv4 `address` (e.g. 0.0.0.0) also
# keeps the server IPv4-only.
ipv6:
  enabled: true
  address: ""            # explicit v6 bind; "" lets the top-level address govern
  dynIp6: "auto"         # server's public IPv6, or "auto", or "" to not advertise one
  publishSources: true   # emit the IPv6 sentinel and honour the OP_*_IPV6 opcodes
  probeReachability: true # verify a client's IPv6 is reachable before publishing it
  # Resolved only when dynIp6 is "auto". Literal-IP endpoints first (they pin the
  # family), then v6-only hosts, then dual-stack hosts. Falls back to a local
  # global-scope interface address if all fail. A temporary (privacy), deprecated
  # or tentative answer is swapped for a stable address on the same host; with
  # several stable addresses, set dynIp6 explicitly. See docs/ipv6-multi-address.md.
  testUrls6:
    - "https://[2606:4700:4700::1111]/cdn-cgi/trace"
    - "https://v6.ident.me"
    - "https://ipv6.icanhazip.com"
    - "https://api64.ipify.org"
    - "https://www.cloudflare.com/cdn-cgi/trace"
    - "https://6.ipw.cn"

# Local admin status dashboard: a single self-contained HTML page (served with only
# the Go standard library) showing live client/file/LowID/server counts, listening
# ports, enabled features, version and uptime. Default on and bound to loopback, so
# it is reachable only from this machine. It has no authentication — widen bindIP to
# expose it only if you add your own access control. See docs/admin-status-dashboard.md.
admin:
  enabled: true
  bindIP: "127.0.0.1"   # loopback only; "0.0.0.0" / "::" exposes it on all interfaces
  port: 4560
  # Basic-auth credentials for clients that are not on loopback (a loopback client never
  # needs them; one arriving through a reverse proxy does). Without them such a client
  # sees the status page only. Put real values in enode.local.yaml.
  username: ""
  password: ""
  # Look up the latest published release on GitHub once a day (HEAD request to
  # github.com/ModderMule/eNode-go/releases/latest) and link to it on the dashboard
  # when it is newer than this build. false = never contact GitHub.
  checkUpdates: true

storage:
  engine: memory
  cleanup:
    # Expires offline clients and their sources. Without it, rows accumulate for
    # the lifetime of the deployment and the online-count index only defers the
    # cost of scanning them.
    enabled: true
    staleAfterHours: 24
    intervalMinutes: 60
    # Kad and source exchange can still find sources for a file the server has
    # no online source for, so the search result stays useful — it is how a user
    # discovers the hash in the first place. Defaults to true when omitted.
    keepZeroSourceFiles: true
    batchSize: 1000
  # Persist the in-RAM index to disk so a restart does not have to re-learn it from
  # client re-offers. Memory engine only: mysql and mongodb already persist, and
  # enabling this under them is a logged no-op. Written every intervalMinutes and
  # once more on shutdown; loaded at startup.
  #
  # Off by default — it trades disk and a periodic write for a warm start, and the
  # file can be large (see docs/memory-footprint.md for the RAM figures it tracks).
  # Restoring matches what a mysql server looks like after a restart: files come
  # back searchable, but sources and clients do not come back online, so source
  # lists stay empty until each client re-offers. See docs/storage-snapshot.md.
  snapshot:
    enabled: false
    file: "data/storage.gob"
    intervalMinutes: 15
    compress: true      # gzip the gob; the reader detects either form on load
  mysql:
    database: enode
    host: localhost
    port: 3306
    user: enode
    pass: password
    connections: 8
    # Base pause (ms) before retrying a deadlocked statement; doubled per retry (capped at 2 s),
    # randomized, up to 6 retries.
    deadlockDelay: 100
    # DDL applied on first connect when the tables are missing; relative to the working directory.
    schemaFile: misc/enode.sql
    # Full-text search strategy: mariadb (word-prefix, portable) | mysql (ngram substring, MySQL 5.7.6+).
    dialect: mariadb
  mongodb:
    host: 127.0.0.1
    port: 27017
    database: enode
    uri: ""

# Debug-only development aid. When seedFixtures is true, the dummy peers and files in
# fixturesFile are injected into the chosen storage engine at startup (via the same
# Connect/AddFile calls a real login takes), so the search results and source lists
# the server sends can be exercised without live clients. OFF here; ON in
# enode.local.yaml. Never enable on a public server — it advertises fake sources.
debug:
  seedFixtures: false
  fixturesFile: tests/data/debug_fixtures.yaml
